<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>guidebook</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="index.html">SCENT ARCHIVE</a>

      <nav>
        <a href="index.html">HOME</a>
        <a href="products.html">PRODUCTS</a>
        <a href="guidebook.html">GUIDEBOOK</a>
      </nav>
      <a class="header-link" href="products.html">DISCOVER ↗</a>
    </header>

    <main>
      <section class="collection-intro">
        <p class="eyebrow">SCENT ARCHIVE· PERSONAL CONSULTATION</p>

        <h1>FIND YOUR SCENT</h1>

        <p class="collection-description">
          당신의 취향에 어울리는 향기를 발견해 보세요.
        </p>
      </section>
      <section class="recommend-box">
        <p class="eyevrow">STEP 01· YOUR PREFERENCE</p>
        <h2>어떤 분위기의 향기를 찾고 있나요?</h2>

        <div class="scent-options">
          <button class="scent-btn" data-scent="fresh">
            <span class="scent-number">01.</span>
            <span class="scent-name">FRESH</span>
            <span class="scent-detail">상쾌하고 깨끗한 향</span>
          </button>

          <button class="scent-btn" data-scent="woody">
            <span class="scent-number">02.</span>
            <span class="scent-name">WOODY</span>
            <span class="scent-detail">차분하고 깉이 있는 향</span>
          </button>

          <button class="scent-btn" data-scent="floral">
            <span class="scent-number">03.</span>
            <span class="scent-name">FLORAL</span>
            <span class="scent-detail">부드럽고 우아한 꽃 향</span>
          </button>

          <button class="scent-btn" data-scent="sweet">
            <span class="scent-number">04.</span>
            <span class="scent-name">SWEET</span>
            <span class="scent-detail">포근하고 달콤한 향</span>
          </button>
        </div>

        <p id="recommend-result">마음에 드는 분위기를 선택해 주세요.</p>
        <div id="recommended-products"></div>
      </section>

      <section class="brand-note">
        <p class="eyebrow">A FRAGRANCE TO REMEMBER</p>

        <h2>
          당신만의 향기 <br />
          평범한 순간을 특별하게
        </h2>

        <a href="products.html">EXPLORE COLLECTION ↗</a>
      </section>
    </main>
    <script src="script.js"></script>
